<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'none';
        form-action 'none';
        frame-ancestors 'none';
        object-src 'none';
        img-src 'self' data:;
        connect-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        upgrade-insecure-requests;
      ">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
  <title>Claw 🦞 Glancer</title>
  <style>
    :root{
      --bg:#050807;
      --panel:#07110c;
      --grid:rgba(0,255,140,.08);
      --txt:rgba(180,255,220,.92);
      --muted:rgba(180,255,220,.60);
      --neon:rgba(0,255,140,.95);
      --warn:rgba(255,120,120,.95);
      --amber:rgba(255,210,120,.95);
      --shadow: 0 12px 40px rgba(0,0,0,.45);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

html, body { height: 100%; }

body{
  margin:0;
  min-height: 100%;
  background: linear-gradient(180deg, #030504 0%, #050807 45%, #040706 100%);
  background-attachment: fixed;
  color: var(--txt);
  font-family: var(--sans);
  overflow-x: hidden;
  position: relative;
}


body::before{
  content:"";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.00),
    rgba(255,255,255,0.00) 2px,
    rgba(0,0,0,0.10) 3px
  );
  pointer-events: none;
  opacity: .20;
  z-index: 0;
}

.wrap{
  max-width: 1200px;
  margin: 0 auto;
  padding: 26px 18px 40px;
  position: relative;
  z-index: 1; 
}

header{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom:16px;
  text-align:center;
}

.title{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
}

h1{
  margin:0;
  font-size:20px;
  letter-spacing:.5px;
  font-family:var(--mono);
  color:var(--neon);
  text-shadow:0 0 18px rgba(0,255,140,.12);
  text-align:center;
}

.sub{
  margin:0;
  font-size:12px;
  color:var(--muted);
  font-family:var(--mono);
}

.panel{
  background: rgba(7,17,12,.78);
  border: 1px solid rgba(0,255,140,.18);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.controls{
  padding: 14px;
  display: grid;
  grid-template-columns: 1.3fr .7fr 1fr max-content; 
  gap: 10px;
  align-items: center;
}

button#refresh{
  width: max-content;    
  justify-self: end;     
  white-space: nowrap;   
}

.controls > *{ min-width: 0; } 

@media (max-width: 900px){
  .controls{ grid-template-columns: 1fr 1fr; }
}

input, select, button{
  width:100%;
  padding:10px 12px;
  border-radius:14px;
  border:1px solid rgba(0,255,140,.18);
  background: rgba(0,0,0,.25);
  color: var(--txt);
  font-family: var(--mono);
  outline:none;

  
#tag {
  width: auto;          
  justify-self: start;  
  min-width: 260px;     
  max-width: 320px;     
}
}

  #q{
    max-width: 420px;   
    justify-self: start;
  }


select{
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  padding-right: 38px;                 
  background-image:
    linear-gradient(45deg, transparent 50%, rgba(0,255,140,.75) 50%),
    linear-gradient(135deg, rgba(0,255,140,.75) 50%, transparent 50%),
    linear-gradient(to right, rgba(0,255,140,.18), rgba(0,255,140,.18));
  background-position:
    calc(100% - 18px) 50%,
    calc(100% - 12px) 50%,
    calc(100% - 34px) 50%;
  background-size:
    6px 6px,
    6px 6px,
    1px 18px;
  background-repeat: no-repeat;
}

select:focus, input:focus{
  border-color: rgba(0,255,140,.42);
  box-shadow: 0 0 0 3px rgba(0,255,140,.10);
}

option{
  background: #050807;
  color: rgba(180,255,220,.92);
}


input{
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

input::placeholder{ color: rgba(180,255,220,.45); }

button{
  cursor:pointer;
  padding: 10px 14px;
  width: auto; 
  border: 1px solid rgba(0,255,140,.30);
  background: rgba(0,255,140,.08);
}

button:hover{ background: rgba(0,255,140,.14); }

.meta{
  padding: 0 14px 14px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  color: var(--muted);
  font-family: var(--mono);
  font-size:12px;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(0,255,140,.18);
  background: rgba(0,0,0,.18);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background: var(--neon);
  box-shadow: 0 0 12px rgba(0,255,140,.30);
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-family: var(--mono);
  font-size:12px;
}

thead th{
  text-align:left;
  padding:12px 14px;
  color: rgba(200,255,230,.85);
  border-bottom:1px solid rgba(0,255,140,.16);
  background: rgba(0,0,0,.16);
  position:sticky;
  top:0;
  backdrop-filter: blur(8px);
}

tbody td{
  padding:12px 14px;
  border-bottom:1px solid rgba(0,255,140,.10);
  vertical-align:top;
}

tbody tr:hover{ background: rgba(0,255,140,.06); }

.score{ font-weight:700; color: var(--neon); }

.sev{ font-weight:700; }
.sev.CRITICAL{ color: var(--warn); }
.sev.HIGH{ color: var(--amber); }

.tags{ display:flex; flex-wrap:wrap; gap:6px; }

.tag{
  padding:3px 8px;
  border-radius:999px;
  border:1px solid rgba(0,255,140,.16);
  background: rgba(0,0,0,.18);
  color: rgba(180,255,220,.88);
  font-size:11px;
  white-space:nowrap;
}

.summary{
  color: rgba(200,255,230,.88);
  line-height:1.35;
  max-width:72ch;
}

a{ color: rgba(0,255,140,.92); text-decoration:none; }
a:hover{ text-decoration:underline; }

.err{
  margin-top:12px;
  padding:12px 14px;
  border-radius: var(--radius);
  border:1px solid rgba(255,120,120,.35);
  background: rgba(255,120,120,.08);
  font-family: var(--mono);
  color: rgba(255,210,210,.92);
  white-space: pre-wrap;
}

/* Rolling Cyber Intel Ticker */
.ticker-wrap {
  width: 100%;
  background: rgba(4, 10, 7, 0.94);
  border-bottom: 1px solid rgba(0, 255, 140, 0.22);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  overflow: hidden;
  height: 38px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: var(--mono);
  font-size: 11px;
}

.ticker-badge {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 255, 140, 0.12);
  border-right: 1px solid rgba(0, 255, 140, 0.25);
  padding: 0 14px;
  height: 100%;
  font-weight: 700;
  color: var(--neon);
  letter-spacing: 0.5px;
  z-index: 2;
}

.ticker-pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--neon);
  box-shadow: 0 0 8px var(--neon);
  animation: pulse 1.6s infinite ease-in-out;
}

@keyframes pulse {
  0%, 100% { transform: scale(0.9); opacity: 0.6; }
  50% { transform: scale(1.3); opacity: 1; }
}

.ticker-track {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  mask-image: linear-gradient(to right, transparent, black 15px, black calc(100% - 15px), transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, black 15px, black calc(100% - 15px), transparent);
}

.ticker-content {
  display: inline-block;
  white-space: nowrap;
  animation: ticker-roll 65s linear infinite;
  padding-left: 20px;
}

.ticker-content:hover {
  animation-play-state: paused;
}

@keyframes ticker-roll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-right: 42px;
  color: var(--txt);
}

.ticker-item a {
  color: var(--txt);
  text-decoration: none;
  transition: color 0.15s;
}

.ticker-item a:hover {
  color: var(--neon);
  text-decoration: underline;
}

.ticker-src {
  color: var(--neon);
  font-weight: 700;
  background: rgba(0, 255, 140, 0.12);
  border: 1px solid rgba(0, 255, 140, 0.25);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
}

.ticker-sep {
  color: rgba(0, 255, 140, 0.35);
  margin-left: 10px;
}

.badge-kev {
  display: inline-block;
  background: rgba(255, 45, 85, 0.22);
  border: 1px solid rgba(255, 45, 85, 0.7);
  color: #ff3b65;
  font-weight: 700;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 6px;
  text-shadow: 0 0 8px rgba(255, 45, 85, 0.4);
  letter-spacing: 0.5px;
  vertical-align: middle;
}

.tag-kev {
  border-color: rgba(255, 45, 85, 0.4) !important;
  color: #ff4d6d !important;
  background: rgba(255, 45, 85, 0.12) !important;
}

.epss-pill {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--mono);
}
.epss-high {
  background: rgba(255, 60, 60, 0.15);
  border: 1px solid rgba(255, 60, 60, 0.5);
  color: #ff6060;
  box-shadow: 0 0 8px rgba(255, 60, 60, 0.2);
}
.epss-med {
  background: rgba(255, 180, 50, 0.15);
  border: 1px solid rgba(255, 180, 50, 0.5);
  color: #ffb838;
}
.epss-low {
  background: rgba(0, 255, 140, 0.08);
  border: 1px solid rgba(0, 255, 140, 0.25);
  color: rgba(180, 255, 220, 0.7);
}
.muted-dash {
  color: rgba(180, 255, 220, 0.35);
}

@media (max-width: 520px){
  .wrap{ padding: 18px 12px 28px; }
  .controls{ grid-template-columns: 1fr; }
  button#refresh{ width: auto; } 
  thead th, tbody td{ padding: 10px 10px; }
  table{ font-size: 11px; }
  .ticker-badge { padding: 0 8px; font-size: 10px; }
}

  </style>
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker-badge">
      <span class="ticker-pulse"></span>
      <span>LIVE INTEL</span>
    </div>
    <div class="ticker-track">
      <div class="ticker-content" id="tickerContent">
        <span class="ticker-item"><span class="ticker-src">[INTEL]</span> Initializing cyber threat monitoring feed...</span>
      </div>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="title">
        <h1>Claw 🦞 Glancer</h1>
        
      </div>
    </header>

    <section class="panel">
      <div class="controls">
        
        <select id="tag">
          <option value="">Tag: any</option>
        </select>
        <select id="minScore">
          <option value="0">Min score: 0</option>
          <option value="60">Min score: 60</option>
          <option value="80">Min score: 80</option>
          <option value="100">Min score: 100</option>
          <option value="120">Min score: 120</option>
          <option value="140">Min score: 140</option>
        </select>
        <button id="refresh">Refresh</button>
      </div>

      <div class="meta">
        <div class="pill"><span class="dot"></span><span id="status">Idle</span></div>
        <div class="pill">Last load: <span id="lastLoad">never</span></div>
        <div class="pill">Showing: <span id="count">0</span></div>
      </div>

      <div id="err" class="err" style="display:none"></div>

      <div style="overflow:auto; border-top:1px solid rgba(0,255,140,.10)">
        <table>
          <thead>
            <tr>
              <th style="width:75px">Score</th>
              <th style="width:160px">CVE</th>
              <th style="width:90px">Severity</th>
              <th style="width:95px">EPSS Prob</th>
              <th style="width:200px">Tags</th>
              <th>Summary</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

<script>
const DATA_FILES = ["data/prioritized_threats.json", "prioritized_threats.json"]; 
const TICKER_FILES = ["data/ticker_feed.json", "ticker_feed.json"];
let all = [];

let lastManualRefresh = 0;
const REFRESH_COOLDOWN_MS = 10_000;


const el = (id)=>document.getElementById(id);
const rowsEl = el("rows");
const errEl = el("err");
const statusEl = el("status");
const lastLoadEl = el("lastLoad");
const countEl = el("count");

const tagEl = el("tag");
const minScoreEl = el("minScore");

function setStatus(s){ statusEl.textContent = s; }
function showErr(msg){
  errEl.style.display = "block";
  errEl.textContent = msg;
}
function clearErr(){ errEl.style.display = "none"; errEl.textContent = ""; }

function uniqTags(items){
  const s = new Set();
  for (const x of items){
    const tags = x.tags || [];
    for (const t of tags) s.add(t);
  }
  return Array.from(s).sort();
}

function renderTagOptions(){
  const tags = uniqTags(all);
  const current = tagEl.value;
  tagEl.innerHTML = '<option value="">Tag: any</option>' + tags.map(t => `<option value="${t}">${t}</option>`).join("");
  if (tags.includes(current)) tagEl.value = current;
}

function match(x, q, tag, minScore){
  const score = Number(x.intel_score ?? 0);
  if (score < minScore) return false;
  if (tag){
    const tags = x.tags || [];
    if (!tags.includes(tag)) return false;
  }
  if (!q) return true;
  const hay = [
    x.cve_id || "",
    x.summary || "",
    (x.tags || []).join(" "),
    (x.reasons || []).join(" ")
  ].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const q = "";
  const tag = tagEl.value;
  const minScore = Number(minScoreEl.value || 0);

  const filtered = all.filter(x => match(x, q, tag, minScore));
  countEl.textContent = filtered.length;

  rowsEl.innerHTML = filtered.map(x => {
    const score = x.intel_score ?? 0;
    const sev = x.severity || "";
    const tags = x.tags || [];
    const summary = x.summary || "";
    const cve = x.cve_id || "";
    const isKev = Boolean(x.cisa_kev || tags.includes("cisa_kev"));
    const epss = x.epss != null ? Number(x.epss) : null;

    let epssHtml = `<span class="muted-dash">—</span>`;
    if (epss != null) {
      const epssClass = epss >= 50 ? 'epss-high' : (epss >= 15 ? 'epss-med' : 'epss-low');
      const percText = x.epss_percentile != null ? ` (Percentile: ${esc(x.epss_percentile)}%)` : '';
      epssHtml = `<span class="epss-pill ${epssClass}" title="EPSS Exploit Probability: ${epss}%${percText}">${epss}%</span>`;
    }

    const kevBadge = isKev ? `<span class="badge-kev" title="Confirmed actively exploited in the wild (CISA KEV)">KEV</span>` : "";

    return `
      <tr>
        <td class="score">${esc(score)}</td>
        <td>
          <a href="https://nvd.nist.gov/vuln/detail/${encodeURIComponent(cve)}" target="_blank" rel="noreferrer">${esc(cve)}</a>
          ${kevBadge}
        </td>
        <td class="sev ${esc(sev)}">${esc(sev)}</td>
        <td>${epssHtml}</td>
        <td><div class="tags">${tags.map(t => `<span class="tag ${t === 'cisa_kev' ? 'tag-kev' : ''}">${esc(t)}</span>`).join("")}</div></td>
        <td class="summary">${esc(summary)}</td>
      </tr>
    `;
  }).join("");
}

async function load(){
  clearErr();
  setStatus("Loading…");
  let lastError = null;

  for (const path of DATA_FILES) {
    try {
      const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${path}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("JSON is not an array");
      all = data;
      renderTagOptions();
      render();
      const now = new Date();
      lastLoadEl.textContent = now.toISOString().replace("T"," ").replace("Z"," UTC");
      setStatus("OK");
      return;
    } catch (e) {
      lastError = e;
    }
  }

  setStatus("ERROR");
  showErr(String(lastError || "Failed to load threat data"));
}

async function loadTicker(){
  const tickerEl = el("tickerContent");
  if (!tickerEl) return;
  for (const path of TICKER_FILES) {
    try {
      const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) continue;
      const items = await res.json();
      if (!Array.isArray(items) || items.length === 0) continue;
      const doubled = [...items, ...items];
      tickerEl.innerHTML = doubled.map(it => `
        <span class="ticker-item">
          <span class="ticker-src">[${esc(it.source || "INTEL")}]</span>
          <a href="${esc(it.link || "#")}" target="_blank" rel="noopener noreferrer">${esc(it.title)}</a>
          <span class="ticker-sep">///</span>
        </span>
      `).join("");
      return;
    } catch(e) {
      // try next
    }
  }
}

el("refresh").addEventListener("click", () => {
  const now = Date.now();
  if (now - lastManualRefresh < REFRESH_COOLDOWN_MS){
    setStatus("Cooling down…");
    return;
  }
  lastManualRefresh = now;
  load();
  loadTicker();
});


document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    load();
    loadTicker();
  }
});


load();
loadTicker();
</script>
</body>
</html>
